<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xat WebRTC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PANTALLA 1: pedir el nombre -->
  <section id="pantallaNom" class="targeta">
    <h1>Xat P2P amb WebRTC</h1>
    <form id="formNom">
      <label for="inputNom">Com et dius?</label>
      <input id="inputNom" type="text" maxlength="30" placeholder="El teu nom" autocomplete="off" required>
      <button type="submit">Entrar</button>
    </form>
    <p class="ajuda">En entrar et demanarà permís per a la càmera i el micro.</p>
  </section>

  <!-- PANTALLA 2: mi cámara + lista de conectados + chat -->
  <section id="pantallaXat" class="oculta">
    <aside class="lateral">
      <p class="jo">Ets: <strong id="elMeuNom"></strong></p>

      <!-- Mi cámara (reproducción local, como en webrtc.org) -->
      <video id="localVideo" autoplay playsinline muted></video>
      <p id="estatMedia" class="ajuda"></p>
      <div class="controls">
        <button id="botoCamera" type="button" disabled>Apagar càmera</button>
        <button id="botoMicro" type="button" disabled>Silenciar micro</button>
      </div>
      <label for="availableCameras" class="ajuda">Càmera:</label>
      <select id="availableCameras" disabled></select>

      <h2>Connectats</h2>
      <ul id="llistaUsuaris"></ul>
      <p class="ajuda">Clica un usuari per obrir una videotrucada i un xat P2P.</p>
    </aside>

    <main class="xat">
      <header id="capXat">Selecciona un usuari de la llista</header>

      <!-- Vídeo de la otra persona -->
      <div id="zonaVideo" class="oculta">
        <video id="remoteVideo" autoplay playsinline></video>
      </div>

      <ul id="missatges"></ul>
      <form id="formMissatge">
        <input id="inputMissatge" type="text" placeholder="Escriu un missatge..." autocomplete="off" disabled>
        <button id="botoEnviar" type="submit" disabled>Enviar</button>
      </form>
    </main>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
